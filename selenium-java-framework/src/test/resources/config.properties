# Selenium Java Framework Configuration
# Default configuration properties

# Browser Configuration
browser=chrome
headless=false

# Application Configuration  
baseUrl=http://localhost:8080
environment=qa

# Wait Configuration
explicitWait=10
implicitWait=5

# Retry Configuration
retryCount=2

# Parallel Execution Configuration
parallel=false
threadCount=2

# Reporting Configuration
takeScreenshotOnFailure=true
allureReports=true

# Logging Configuration
logLevel=INFO