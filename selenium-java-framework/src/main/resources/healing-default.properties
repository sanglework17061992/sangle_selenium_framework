# Self-Healing Locator System Configuration
# Default values for the healing system

# Enable/disable healing functionality
healing.enabled=true

# Healing mode: auto (automatically apply high-confidence healing) or suggest-only (generate suggestions only)
healing.mode=auto

# Confidence threshold for auto-healing (0.0 to 1.0)
healing.confidenceThreshold=0.75

# Maximum number of candidates to consider
healing.maxCandidates=5

# Healing timeout in milliseconds
healing.timeout=10000

# Notification settings
healing.notifications.enabled=false
healing.notifications.webhookUrl=

# Storage settings
healing.locators.file=healing/locator_repository.json
healing.suggestions.file=healing/healing_suggestions.json

# Snapshot and backup settings
healing.persistSnapshots=true
healing.notifyOnHeal=true
healing.backup.directory=healing/backups
healing.backup.auto=true
healing.backup.retentionDays=30