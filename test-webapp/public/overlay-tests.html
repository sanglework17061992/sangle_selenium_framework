<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overlay Tests</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div class="container">
        <h1>🔲 Overlay Tests</h1>
        <p class="subtitle">Test elements obscured by overlays, modals, and loading indicators</p>
        
        <a href="/" class="btn" style="margin-bottom: 2rem; display: inline-block;">← Back to Home</a>

        <div class="card">
            <h3>Modal Overlay Test</h3>
            <button class="btn" id="openModalBtn">Open Modal</button>
            <button class="btn btn-success" id="targetBtn">Target Button (click when modal is open)</button>
        </div>

        <div class="card">
            <h3>Loading Overlay Test</h3>
            <button class="btn" id="triggerLoadingBtn">Trigger Loading</button>
            <p id="loadingResult"></p>
        </div>

        <div class="card">
            <h3>Stacked Overlays Test</h3>
            <button class="btn" id="stackedOverlayBtn">Show Stacked Overlays</button>
        </div>
    </div>

    <!-- Modal -->
    <div id="modal" class="overlay hidden">
        <div style="background: white; padding: 2rem; border-radius: 0.5rem; max-width: 400px;">
            <h2>Modal Dialog</h2>
            <p>This modal blocks interactions with elements behind it.</p>
            <button class="btn" id="closeModalBtn">Close Modal</button>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="overlay hidden">
        <div class="spinner"></div>
    </div>

    <script>
        const openModalBtn = document.getElementById('openModalBtn');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const modal = document.getElementById('modal');
        const targetBtn = document.getElementById('targetBtn');
        const triggerLoadingBtn = document.getElementById('triggerLoadingBtn');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const loadingResult = document.getElementById('loadingResult');

        // Modal controls
        openModalBtn.addEventListener('click', () => {
            modal.classList.remove('hidden');
        });

        closeModalBtn.addEventListener('click', () => {
            modal.classList.add('hidden');
        });

        targetBtn.addEventListener('click', () => {
            alert('Target button clicked! Modal should block this.');
        });

        // Loading overlay
        triggerLoadingBtn.addEventListener('click', () => {
            loadingOverlay.classList.remove('hidden');
            loadingResult.textContent = 'Loading...';
            
            setTimeout(() => {
                loadingOverlay.classList.add('hidden');
                loadingResult.textContent = 'Loading complete!';
            }, 3000);
        });
    </script>
</body>
</html>
