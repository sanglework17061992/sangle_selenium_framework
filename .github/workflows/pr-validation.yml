name: PR Validation

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    # Note: ubuntu-latest includes Chrome and Firefox pre-installed
    # No additional browser installation needed
    
    strategy:
      matrix:
        node-version: [ 20.x ]
        browser: [ chrome, firefox ]
    
    steps:
      # Step 1: Checkout latest code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      # Step 2: Setup Node.js
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm ci
      
      # Step 4: Type check with TypeScript
      - name: Type check with TypeScript
        run: npm run build
        
      # Step 5: Run tests with ${{ matrix.browser }} and generate reports
      - name: Run tests with ${{ matrix.browser }}
        run: npm run test:multi
        env:
          BROWSER: ${{ matrix.browser }}
          CI: 'true'
          HEADLESS: 'true'
          NO_SANDBOX: 'true'
      
      # Step 5b: List generated artifacts (debug)
      - name: List test artifacts
        if: always()
        run: ls -la mochawesome-report/ allure-results/ 2>&1 || echo "Directories not found"
        
      # Step 6: Upload test results
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.node-version }}-${{ matrix.browser }}
          path: |
            mochawesome-report/
            allure-results/
          retention-days: 30
          if-no-files-found: warn

