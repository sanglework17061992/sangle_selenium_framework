name: 🚀 Selenium Test Automation CI/CD Pipeline (Fixed)

on:
  push:
    branches: [ main, develop, implementation ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test Suite to Run'
        required: true
        default: 'smoke'
        type: choice
        options:
        - smoke
        - regression
        - full
      browser:
        description: 'Browser for Testing'
        required: true
        default: 'chrome'
        type: choice
        options:
        - chrome
        - firefox

jobs:
  # ==========================================
  # 🏗️ BUILD & SETUP JOB
  # ==========================================
  build-and-setup:
    runs-on: ubuntu-latest
    outputs:
      test-app-ready: ${{ steps.setup-test-app.outputs.ready }}
      
    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4
      
    - name: ☕ Setup Java 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
        
    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: 🚀 Setup Test Application
      id: setup-test-app
      run: |
        cd test-app
        # Start the Node.js server in background
        nohup node server.js > server.log 2>&1 &
        echo $! > server.pid
        
        # Wait for server to start
        sleep 5
        
        # Health check
        for i in {1..30}; do
          if curl -f http://localhost:8080/ > /dev/null 2>&1; then
            echo "✅ Test app is running on port 8080"
            echo "ready=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "⏳ Waiting for test app to start... (attempt $i/30)"
          sleep 2
        done
        
        echo "❌ Test app failed to start"
        echo "ready=false" >> $GITHUB_OUTPUT
        exit 1
        
    - name: 🏗️ Build Selenium Framework
      run: |
        cd selenium-java-framework
        mvn clean compile -q
        echo "✅ Selenium framework compiled successfully"

  # ==========================================
  # 🧪 SMOKE TESTS JOB
  # ==========================================
  smoke-tests:
    needs: build-and-setup
    runs-on: ubuntu-latest
    if: needs.build-and-setup.outputs.test-app-ready == 'true'
    
    strategy:
      matrix:
        browser: [chrome, firefox]
        
    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4
      
    - name: ☕ Setup Java 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
        
    - name: 🟢 Setup Node.js & Start Test App
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: 🚀 Start Test Application
      run: |
        cd test-app
        nohup node server.js > server.log 2>&1 &
        echo $! > server.pid
        sleep 5
        curl -f http://localhost:8080/ || exit 1
        
    - name: 🌐 Setup Browser Dependencies
      run: |
        # Install Chrome
        if [ "${{ matrix.browser }}" = "chrome" ]; then
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
        fi
        
        # Install Firefox
        if [ "${{ matrix.browser }}" = "firefox" ]; then
          sudo apt-get update
          sudo apt-get install -y firefox
        fi
        
    - name: 🧪 Run Smoke Tests
      run: |
        cd selenium-java-framework
        mvn test -Dtest=LoginTest#testValidLogin,ProductTest#testProductDisplay \
                 -Dbrowser=${{ matrix.browser }} \
                 -Dheadless=true \
                 -DbaseUrl=http://localhost:8080 \
                 -Dmaven.test.failure.ignore=true
                 
    - name: 📊 Generate Allure Report (Simple)
      if: always()
      run: |
        cd selenium-java-framework
        
        # Create reports directory
        mkdir -p target/allure-report
        
        # Check if we have test results
        if [ -d "target/allure-results" ] && [ "$(ls -A target/allure-results)" ]; then
          echo "✅ Test results found, generating report..."
          
          # Try Maven Allure plugin first
          if mvn allure:report > /dev/null 2>&1; then
            echo "✅ Maven Allure report generated successfully"
          else
            echo "⚠️ Maven plugin failed, using alternative method..."
            
            # Download Allure commandline as backup
            wget -q https://repo1.maven.org/maven2/io/qameta/allure/allure-commandline/2.24.0/allure-commandline-2.24.0.tgz
            tar -xzf allure-commandline-2.24.0.tgz
            
            # Generate report
            if ./allure-2.24.0/bin/allure generate target/allure-results --clean -o target/allure-report; then
              echo "✅ Alternative Allure report generated successfully"
            else
              echo "❌ Failed to generate Allure report, creating simple HTML report"
              cat > target/allure-report/index.html << EOF
        <!DOCTYPE html>
        <html>
        <head>
            <title>Test Results - ${{ matrix.browser }}</title>
            <style>
                body { font-family: Arial, sans-serif; margin: 40px; }
                .header { background: #f0f0f0; padding: 20px; border-radius: 5px; }
                .info { margin: 20px 0; }
            </style>
        </head>
        <body>
            <div class="header">
                <h1>Selenium Test Results</h1>
                <p><strong>Browser:</strong> ${{ matrix.browser }}</p>
                <p><strong>Date:</strong> $(date)</p>
                <p><strong>Status:</strong> Tests executed, report generation had issues</p>
            </div>
            <div class="info">
                <p>Test results are available in the Surefire reports.</p>
                <p>Check the artifacts for detailed test output.</p>
            </div>
        </body>
        </html>
        EOF
            fi
          fi
        else
          echo "⚠️ No test results found"
          cat > target/allure-report/index.html << EOF
        <!DOCTYPE html>
        <html>
        <head>
            <title>No Test Results</title>
        </head>
        <body>
            <h1>No Test Results Available</h1>
            <p>Browser: ${{ matrix.browser }}</p>
            <p>No test results were generated during this run.</p>
        </body>
        </html>
        EOF
        fi
        
    - name: 📋 Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: smoke-test-results-${{ matrix.browser }}
        path: |
          selenium-java-framework/target/allure-report/
          selenium-java-framework/target/surefire-reports/
          selenium-java-framework/target/screenshots/
          test-app/server.log
        retention-days: 30

  # ==========================================
  # 📊 REPORT GENERATION JOB
  # ==========================================
  generate-reports:
    needs: [smoke-tests]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: 📥 Download All Test Results
      uses: actions/download-artifact@v4
      with:
        path: test-results/
        
    - name: 📊 Combine Test Reports
      run: |
        echo "## 🧪 Test Execution Summary" > test-summary.md
        echo "| Browser | Smoke Tests | Status |" >> test-summary.md
        echo "|---------|-------------|--------|" >> test-summary.md
        
        for browser in chrome firefox; do
          smoke_status="❌ Not Run"
          
          if [ -d "test-results/smoke-test-results-$browser" ]; then
            smoke_status="✅ Completed"
          fi
          
          echo "| $browser | $smoke_status | Overall Status |" >> test-summary.md
        done
        
        echo "" >> test-summary.md
        echo "📅 **Execution Date:** $(date)" >> test-summary.md
        echo "🔗 **Commit:** ${{ github.sha }}" >> test-summary.md
        echo "🌿 **Branch:** ${{ github.ref_name }}" >> test-summary.md
        
    - name: 📋 Upload Combined Reports
      uses: actions/upload-artifact@v4
      with:
        name: combined-test-reports
        path: |
          test-results/
          test-summary.md
        retention-days: 90

  # ==========================================
  # 🔔 NOTIFICATION JOB
  # ==========================================
  notify-results:
    needs: [smoke-tests, generate-reports]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: 📧 Send Test Results Notification
      run: |
        echo "🚀 Test execution completed!"
        echo "📊 Results available in artifacts"
        echo "🔗 View details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"