<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Content Test</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div class="container">
        <h1>🔄 Dynamic Content Test</h1>
        <p class="subtitle">Test dynamically added and removed elements</p>
        
        <a href="/" class="btn" style="margin-bottom: 2rem; display: inline-block;">← Back to Home</a>

        <div class="card">
            <h3>Add/Remove Elements</h3>
            <button class="btn" id="addElementBtn">Add Element</button>
            <button class="btn btn-danger" id="removeElementBtn">Remove Last Element</button>
            <button class="btn btn-warning" id="clearAllBtn">Clear All</button>
            <div id="dynamicContainer" style="margin-top: 1rem;"></div>
        </div>

        <div class="card">
            <h3>Replace Content</h3>
            <button class="btn" id="replaceBtn">Replace Content</button>
            <div id="replaceContainer">
                <p id="originalContent">Original content here</p>
            </div>
        </div>

        <div class="card">
            <h3>List Management</h3>
            <input type="text" id="itemInput" placeholder="Enter item name">
            <button class="btn" id="addItemBtn">Add Item</button>
            <ul id="itemList" style="list-style: none; padding: 0;"></ul>
        </div>
    </div>

    <script>
        let elementCounter = 0;

        // Add Element
        document.getElementById('addElementBtn').addEventListener('click', () => {
            elementCounter++;
            const container = document.getElementById('dynamicContainer');
            const div = document.createElement('div');
            div.className = 'fade-in';
            div.style.padding = '0.5rem';
            div.style.marginBottom = '0.5rem';
            div.style.background = '#f3f4f6';
            div.style.borderRadius = '0.375rem';
            div.innerHTML = `
                <span>Dynamic Element #${elementCounter}</span>
                <button class="btn" style="margin-left: 1rem;" onclick="this.parentElement.remove()">Remove</button>
            `;
            container.appendChild(div);
        });

        // Remove Last Element
        document.getElementById('removeElementBtn').addEventListener('click', () => {
            const container = document.getElementById('dynamicContainer');
            if (container.lastChild) {
                container.lastChild.remove();
            }
        });

        // Clear All
        document.getElementById('clearAllBtn').addEventListener('click', () => {
            document.getElementById('dynamicContainer').innerHTML = '';
            elementCounter = 0;
        });

        // Replace Content
        document.getElementById('replaceBtn').addEventListener('click', () => {
            const container = document.getElementById('replaceContainer');
            container.innerHTML = `
                <p class="fade-in">Replaced content at ${new Date().toLocaleTimeString()}</p>
                <button class="btn" id="newButton">New Button</button>
            `;
        });

        // List Management
        document.getElementById('addItemBtn').addEventListener('click', () => {
            const input = document.getElementById('itemInput');
            const list = document.getElementById('itemList');
            
            if (input.value.trim()) {
                const li = document.createElement('li');
                li.className = 'fade-in';
                li.style.padding = '0.5rem';
                li.style.marginBottom = '0.5rem';
                li.style.background = '#f3f4f6';
                li.style.borderRadius = '0.375rem';
                li.innerHTML = `
                    <span>${input.value}</span>
                    <button class="btn btn-danger" style="margin-left: 1rem; padding: 0.25rem 0.75rem;" onclick="this.parentElement.remove()">Delete</button>
                `;
                list.appendChild(li);
                input.value = '';
            }
        });

        // Allow Enter key to add item
        document.getElementById('itemInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('addItemBtn').click();
            }
        });
    </script>
</body>
</html>
